[versions]
minecraft     = "1.21.11"
fabric-loader = "0.18.4"
parchment     = "1.21.10:2025.10.12"
fabric-api    = "0.141.2+1.21.11"
fabric-kotlin = "1.13.7+kotlin.2.2.21"
polymer       = "0.15.2+1.21.11"
arcade        = "0.8.1-beta.21+1.21.11"
zip4j         = "2.11.5"

# Plugins
fabric-loom = "1.15-SNAPSHOT"

[libraries]
minecraft              = { module = "com.mojang:minecraft"                  , version.ref = "minecraft" }
fabric-loader          = { module = "net.fabricmc:fabric-loader"            , version.ref = "fabric-loader" }
fabric-api             = { module = "net.fabricmc.fabric-api:fabric-api"    , version.ref = "fabric-api" }
fabric-kotlin          = { module = "net.fabricmc:fabric-language-kotlin"   , version.ref = "fabric-kotlin" }
arcade                 = { module = "net.casualchampionships:arcade"        , version.ref = "arcade" }
arcade-datagen         = { module = "net.casualchampionships:arcade-datagen", version.ref = "arcade" }
polymer-virtual-entity = { module = "eu.pb4:polymer-virtual-entity"         , version.ref = "polymer" }
zip4j                  = { module = "net.lingala.zip4j:zip4j"               , version.ref = "zip4j" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }