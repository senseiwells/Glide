[versions]
fabric-loom          = "1.7-SNAPSHOT"
kotlin-serialization = "1.9.21"
minecraft            = "1.21.1"
fabric-loader        = "0.16.3"
parchment            = "1.21:2024.07.28"
fabric-api           = "0.103.0+1.21.1"
fabric-kotlin        = "1.11.0+kotlin.2.0.0"
arcade               = "0.3.0-alpha.18+1.21.1"
polymer              = "0.9.12+1.21.1"
zip4j                = "2.11.5"

[libraries]
minecraft              = { module = "com.mojang:minecraft"                   , version.ref = "minecraft" }
fabric-loader          = { module = "net.fabricmc:fabric-loader"             , version.ref = "fabric-loader" }
fabric-api             = { module = "net.fabricmc.fabric-api:fabric-api"     , version.ref = "fabric-api" }
fabric-kotlin          = { module = "net.fabricmc:fabric-language-kotlin"    , version.ref = "fabric-kotlin" }
arcade                 = { module = "net.casual-championships:arcade"        , version.ref = "arcade" }
arcade-datagen         = { module = "net.casual-championships:arcade-datagen", version.ref = "arcade" }
polymer-core           = { module = "eu.pb4:polymer-core"                    , version.ref = "polymer" }
polymer-virtual-entity = { module = "eu.pb4:polymer-virtual-entity"          , version.ref = "polymer" }
zip4j                  = { module = "net.lingala.zip4j:zip4j"                , version.ref = "zip4j" }

[plugins]
fabric-loom   = { id = "fabric-loom", version.ref = "fabric-loom" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-serialization" }